{% extends 'users/base.html' %}
{% load static %}
{% block content %}

<main class="auth-page-wrapper">
  <div class="auth-background">
    <img src="{% static 'img/background/pattern.jpg' %}" alt="Background pattern">
  </div>

  <div class="auth-form-container">
    <div class="auth-container auth-message-box">

      <h1 class="section-title mb-6">Set a New Password</h1>
      <p class="section-text mb-6">
        Please enter your new password below. Use a strong password to keep your account secure.
      </p>

      <form method="post" class="auth-form">
        {% csrf_token %}
        {{ form.as_p }}

        <div class="ButtonGroup ButtonGroup--center mt-6">
          <button type="submit" class="button button--primary">Save New Password</button>
        </div>
      </form>

    </div>
  </div>
</main>

{% endblock %}
